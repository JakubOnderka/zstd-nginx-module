name: AddressSanitizer

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_CFLAGS: "-O1 -g -fsanitize=address -fno-omit-frame-pointer -fno-optimize-sibling-calls"
      ASAN_LDFLAGS: "-fsanitize=address -Wl,-rpath,/usr/local/lib"
      ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
    steps:
      - uses: actions/checkout@v7
      - name: Get latest stable nginx and test suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable=$(gh api --paginate 'repos/nginx/nginx/branches?per_page=100' \
            --jq '.[].name' | grep -E '^stable-[0-9]+\.[0-9]+$' | sort -V | tail -1)
          version=${stable#stable-}
          tag=$(gh api --paginate 'repos/nginx/nginx/tags?per_page=100' \
            --jq '.[].name' | grep -E "^release-${version//./\\.}\\.[0-9]+$" | sort -V | tail -1)
          echo "Testing nginx $tag"
          git clone --depth 1 --branch "$tag" https://github.com/nginx/nginx.git "$RUNNER_TEMP/nginx"
          git clone --depth 1 https://github.com/nginx/nginx-tests.git "$RUNNER_TEMP/nginx-tests"
      - name: Build nginx
        working-directory: ${{ runner.temp }}/nginx
        run: |
          ./auto/configure --add-module="$GITHUB_WORKSPACE" --with-cc-opt="$ASAN_CFLAGS -DNGX_DEBUG_PALLOC=1" --with-ld-opt="$ASAN_LDFLAGS"
          make -j"$(nproc)"
      - name: Run tests
        env:
          PERL5LIB: ${{ runner.temp }}/nginx-tests/lib
          TEST_NGINX_BINARY: ${{ runner.temp }}/nginx/objs/nginx
        run: prove -v t/*.t